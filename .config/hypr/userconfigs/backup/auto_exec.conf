# Autostart necessary processes (like notifications daemons, status bars, etc.)

#exec-once = mako    					            #Notifications
exec-once = hyprpanel					            #Taskbar
exec-once = hyprpaper 					            #Wallpaper_Engine
exec-once = waypaper --restore				        #Wallpaper_Setter
exec-once = systemctl --user start hyprpolkitagent	#PolKitAgent
#exec-once = copyq --hide-window			            #ClipboardHistory
exec-once = qs                                      #QuickShell
exec-once = wl-paste --type text --watch cliphist store  #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
exec-once = env QT_NO_XDG_DESKTOP_PORTAL=1 /usr/lib/kdeconnectd
exec-once = env QT_NO_XDG_DESKTOP_PORTAL=1 kdeconnect-indicator

exec-once = ~/.local/bin/notification-logger.sh
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/xdg-desktop-portal-hyprland &
exec-once = /usr/lib/xdg-desktop-portal &
